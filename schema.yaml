# Machine-readable schema. Source of truth for types, properties, allowed values,
# folders and names. schema.md holds the principles and conventions.
#
# Property value types:
#   date      YYYY-MM-DD
#   link      quoted wikilink, "[[Note]]"
#   links     YAML list of quoted wikilinks
#   string    free text
#   strings   YAML list of free text
#   year      four-digit integer
#   kebab     lowercase words joined by hyphens
# Optional properties may be omitted or left empty.
# Properties not listed for a type are invalid, unless the type sets extra: allow.
#
# tools/build.py generates templates/ and types.json from this file. Template
# property order follows `props`; `sections` are the body headings. Defaults
# apply to required properties only: `date` and `started` are today, `cycle` is
# the current year, enums start with their first value. Everything else is empty.
# An empty property counts as absent (so one_of is satisfied by filling one).

version: 1

# Notes in these folders keep their type but skip the folder check.
folder_exempt:
  - archive/**
  - areas/*/archive/**

# Notes in these folders need no type.
untyped:
  - inbox/**
  - _kit/**

checkboxes:
  " ": todo
  "/": in-progress
  "-": cancelled
  "x": done
  ">": moved

# A task's checkbox is a checkbox line that links to the task note. The home
# note is the note the task's `project` or `area` property links to.
task_checkbox:
  repeatable: [">"]
  rules:
    - {id: task-multiple-checkboxes, severity: error}    # >1 checkbox that isn't `moved`
    - {id: task-no-checkbox, severity: warning}          # none that isn't `moved`
    - {id: task-checkbox-outside-home, severity: warning}  # the one checkbox is not in the home note

# Folder names: lowercase, hyphens.
folder_name: '^[a-z0-9]+(-[a-z0-9]+)*$'

types:
  project:
    folder: [projects/*]
    sections: [Goal, Tasks, Notes]
    required: [status, started]
    optional: [area, target]
    props:
      status: {type: enum, values: [active, paused, done, cancelled]}
      area: {type: link}
      started: {type: date}
      target: {type: date}

  task:
    folder: [projects/*, areas/*]
    sections: [Context, Steps]
    one_of: [project, area]
    props:
      project: {type: link}
      area: {type: link}

  area:
    folder: [areas/*]
    sections: [Scope, Tasks, Notes]
    required: [status]
    props:
      status: {type: enum, values: [active, closed]}

  meeting:
    folder: [meetings]
    sections: [Notes, Actions]
    # A single meeting is dated; a recurring series is one note per year.
    name: ['^\d{4}-\d{2}-\d{2} .+', '^\d{4} .+']
    required: [date, attendees]
    optional: [projects, area]
    props:
      date: {type: date}
      projects: {type: links}
      area: {type: link}
      attendees: {type: links}

  incident:
    folder: [areas/*]
    sections: [Summary, Timeline, Follow-ups]
    name: ['^\d{4}-\d{2}-\d{2} .+']
    required: [date, area]
    props:
      date: {type: date}
      area: {type: link}

  person:
    folder: [people]
    sections: [Notes]
    required: [context]
    optional: [aliases]
    props:
      aliases: {type: strings}
      context: {type: string}

  impact:
    folder: [records/impact]
    sections: [What I did, Result]
    name: ['^\d{4}-\d{2}-\d{2} .+']
    required: [date, competency, cycle]
    optional: [project]
    props:
      date: {type: date}
      project: {type: link}
      competency: {type: kebab}
      cycle: {type: year}

  decision:
    folder: [records/decisions]
    sections: [Context, Options, Decision, Consequences]
    name: ['^\d{4}-\d{2}-\d{2} .+']
    required: [date]
    one_of: [project, area]
    props:
      date: {type: date}
      project: {type: link}
      area: {type: link}

  1on1:
    folder: [records/1on1]
    sections: [Topics, Notes, Actions]
    name: ['^\d{4}-\d{2}-\d{2} .+']
    required: [date, person]
    props:
      date: {type: date}
      person: {type: link}

  feedback:
    folder: [records/feedback]
    sections: [Feedback, Context]
    name: ['^\d{4}-\d{2}-\d{2} .+']
    required: [date, person, direction, cycle, status]
    props:
      date: {type: date}
      person: {type: link}
      direction: {type: enum, values: [about-them, received]}
      cycle: {type: year}
      status: {type: enum, values: [open, delivered]}

  cycle:
    folder: [areas/career]
    sections: [Goals, Self review, Outcome]
    required: [cycle]
    props:
      cycle: {type: year}

  story:
    folder: [areas/career]
    sections: [Situation, Task, Action, Result]
    required: [competency, role]
    props:
      competency: {type: kebab}
      role: {type: string}

  reference:
    folder: [reference, reference/*]
    sections: []
    required: [topics]
    props:
      topics: {type: links}

  hub:
    folder: [reference, reference/*]
    sections: [Notes]

  source:
    folder: [sources]
    sections: [Summary, Takeaways]
    required: [kind, author, status]
    optional: [url, started, finished]
    props:
      kind: {type: enum, values: [book, article, paper, course, talk]}
      author: {type: string}
      url: {type: string}
      status: {type: enum, values: [to-read, reading, done, abandoned]}
      started: {type: date}
      finished: {type: date}

  option:
    folder: [projects/*]
    sections: [Pros, Cons, Notes]
    required: [status]
    # Comparison-specific fields (price, location, ...) vary per project.
    extra: allow
    props:
      status: {type: enum, values: [considering, visited, rejected, chosen]}

  daily:
    folder: [daily]
    sections: []
    name: ['^\d{4}-\d{2}-\d{2}$']
    required: [date]
    props:
      date: {type: date}

# For notes whose name starts with a full date, that date must equal the `date`
# property (applies to types with a `date` property; not to yearly meeting series).
name_date_matches_property: true
