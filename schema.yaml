# Schema shared by all vaults: note types, folders, properties, conventions.
# tools/build.py generates templates/ and types.json from it; tools/lint.py
# checks vaults against it.
#
# Principles
# - Folders say what a note is; links and properties say what it is about.
# - Queries are link-based (file.hasLink(this.file)), never folder-based.
#   Exceptions: bases exclude the kit with !file.inFolder("_kit"), and the
#   Untyped base looks into inbox/.
# - Every note has a `type`, except in inbox/ (unprocessed captures) and _kit/.
# - No `tags` property; type and links do that job.
# - A property name has one meaning and one value type across all types
#   (Obsidian types properties per name, vault-wide). A list and a single
#   value get different names: project vs projects.
# - Core Obsidian only: Templates, Daily notes, Bases, Backlinks.
# - Bases are embedded by name (![[Daily.base]]), which resolves vault-wide,
#   so kit base names must be unique in the vault.
#
# Conventions
# - Folder names lowercase with hyphens; note titles keep normal casing.
# - Dated notes: "YYYY-MM-DD Title". A recurring meeting series is one note
#   per year, "YYYY Title", with `date` set to its first meeting. People: full
#   name. Reference notes: a specific concept name.
# - Dates YYYY-MM-DD; links are quoted wikilinks ("[[Note]]"); lists are YAML
#   lists. Enums allow only their listed values.
# - Date properties: `date` for a note about one day (meeting, 1:1, event,
#   daily); `start` and `end` for something that spans time (project,
#   source). No `created`: the date in the name, `date` or `start` already
#   says when.
# - Not every folder exists in every vault. _kit/ is the deployed kit: never
#   edit it in a vault.
#
# Property value types:
#   date      YYYY-MM-DD
#   link      quoted wikilink, "[[Note]]"
#   links     YAML list of quoted wikilinks
#   string    free text
#   strings   YAML list of free text
#   year      four-digit integer
#   kebab     lowercase words joined by hyphens
# Optional properties may be omitted or left empty.
# Properties not listed for a type (or in all_types) are invalid, unless the
# type sets extra: allow.
#
# Templates: property order follows `props`; `sections` are the body headings.
# A section is a heading, or {heading: [embeds]} where each embed is
# `Base.base` or `Base.base#View` (the base and view must exist in bases/).
# Defaults apply to required properties only: `date` and `start` are today,
# `cycle` is the current year, enums start with their first value. Everything
# else is empty.
# An empty property counts as absent (so one_of is satisfied by filling one).

version: 1

# Notes in these folders keep their type but skip the folder check:
# closed projects go to archive/, area history to areas/<name>/archive/<year>/.
folder_exempt:
  - archive/**
  - areas/*/archive/**

# Notes in these folders need no type.
untyped:
  - inbox/**
  - _kit/**

checkboxes:
  " ": todo
  "/": in-progress
  "-": cancelled
  "x": done
  ">": moved

# A task's status is its checkbox: a checkbox line that links to the task
# note. Task notes have no `status` property, so status is stored once.
# A task note has exactly one checkbox, in its home note (the note its
# `project` or `area` property links to). Elsewhere only [>] (moved) is
# allowed, e.g. in a daily note carrying the task forward; a [>] line is never
# the task's status. Bases can't read checkboxes: see the status in the home
# note or the task note's Backlinks pane.
task_checkbox:
  repeatable: [">"]
  rules:
    - {id: task-multiple-checkboxes, severity: error}    # >1 checkbox that isn't `moved`
    - {id: task-no-checkbox, severity: warning}          # none that isn't `moved`
    - {id: task-checkbox-outside-home, severity: warning}  # the one checkbox is not in the home note

# Folder names: lowercase, hyphens.
folder_name: '^[a-z0-9]+(-[a-z0-9]+)*$'

# Optional properties any type may have. They stay out of the templates; a
# type that wants one in its template lists it in its own props.
all_types:
  aliases: {type: strings}

types:
  project:
    # Home note of a project (a goal with an end).
    folder: [projects/*]
    sections: [Goal, Tasks, {Notes: ["Linked notes.base#Tasks", "Linked notes.base#Meetings", "Linked notes.base#Decisions"]}]
    required: [status, start]
    optional: [area, target, end]
    props:
      status: {type: enum, values: [active, paused, done, cancelled]}
      area: {type: link}
      start: {type: date}
      target: {type: date}     # planned end
      end: {type: date}        # actual end

  task:
    # A task big enough to need its own note.
    folder: [projects/*, areas/*]
    sections: [Context, Steps]
    one_of: [project, area]
    props:
      project: {type: link}
      area: {type: link}

  area:
    # Home note of an ongoing responsibility.
    folder: [areas/*]
    sections: [Scope, Tasks, {Notes: ["Linked notes.base#By type"]}]
    required: [status]
    props:
      status: {type: enum, values: [active, closed]}

  meeting:
    # One meeting, or one recurring series per year.
    folder: [meetings]
    sections: [Notes, Actions]
    name: ['^\d{4}-\d{2}-\d{2} .+', '^\d{4} .+']
    required: [date, attendees]
    optional: [projects, area]
    props:
      date: {type: date}
      projects: {type: links}
      area: {type: link}
      attendees: {type: links}

  event:
    # Something that happened in a project or area and deserves its own note
    # (an outage, a contractor visit). Smaller things: a linked line in the
    # daily note.
    folder: [projects/*, areas/*]
    sections: [What happened, Follow-ups]
    name: ['^\d{4}-\d{2}-\d{2} .+']
    required: [date]
    one_of: [project, area]
    props:
      date: {type: date}
      project: {type: link}
      area: {type: link}

  person:
    # Hub note for a person.
    folder: [people]
    sections: [{Notes: ["Linked notes.base#Timeline"]}]
    required: [context]
    optional: [aliases]
    props:
      aliases: {type: strings}
      context: {type: string}

  impact:
    # Something I did that mattered.
    folder: [records/impact]
    sections: [What I did, Result]
    name: ['^\d{4}-\d{2}-\d{2} .+']
    required: [date, competency, cycle]
    optional: [project]
    props:
      date: {type: date}
      project: {type: link}
      competency: {type: kebab}
      cycle: {type: year}

  decision:
    # A decision worth remembering or justifying later.
    folder: [records/decisions]
    sections: [Context, Options, Decision, Consequences]
    name: ['^\d{4}-\d{2}-\d{2} .+']
    required: [date]
    one_of: [project, area]
    props:
      date: {type: date}
      project: {type: link}
      area: {type: link}

  1on1:
    # One 1:1 conversation.
    folder: [records/1on1]
    sections: [Topics, Notes, Actions]
    name: ['^\d{4}-\d{2}-\d{2} .+']
    required: [date, person]
    props:
      date: {type: date}
      person: {type: link}

  feedback:
    # One piece of feedback, about someone or received.
    folder: [records/feedback]
    sections: [Feedback, Context]
    name: ['^\d{4}-\d{2}-\d{2} .+']
    required: [date, person, direction, cycle, status]
    props:
      date: {type: date}
      person: {type: link}
      direction: {type: enum, values: [about-them, received]}
      cycle: {type: year}
      status: {type: enum, values: [open, delivered]}

  cycle:
    # Home note for one performance review cycle.
    folder: [areas/career]
    sections: [Goals, Self review, Outcome, {Impact: ["Impact.base#This cycle"]}, {Feedback: ["Feedback.base#This cycle"]}]
    required: [cycle]
    props:
      cycle: {type: year}

  story:
    # A reusable career story (for interviews, reviews).
    folder: [areas/career]
    sections: [Situation, Task, Action, Result]
    required: [competency, role]
    props:
      competency: {type: kebab}
      role: {type: string}

  reference:
    # Durable knowledge, in my own words.
    folder: [reference, reference/*]
    sections: []
    required: [topics]
    props:
      topics: {type: links}

  hub:
    # Entry point for a topic; reference notes link to it.
    folder: [reference, reference/*]
    sections: [{Notes: ["Linked notes.base#Reference"]}]

  source:
    # My notes on a book, article, paper, course or talk.
    folder: [sources]
    sections: [Summary, Takeaways]
    required: [kind, author, status]
    optional: [url, start, end]
    props:
      kind: {type: enum, values: [book, article, paper, course, talk]}
      author: {type: string}
      url: {type: string}
      status: {type: enum, values: [to-read, reading, done, abandoned]}
      start: {type: date}
      end: {type: date}

  option:
    # A candidate being compared (house, hotel, employer).
    folder: [projects/*]
    sections: [Pros, Cons, Notes]
    required: [status]
    # Comparison-specific fields (price, location, ...) vary per project.
    extra: allow
    props:
      status: {type: enum, values: [considering, visited, rejected, chosen]}

  daily:
    # Daily note: capture (work) or journal (personal).
    folder: [daily]
    sections: [{On this day: ["Daily.base"]}]
    name: ['^\d{4}-\d{2}-\d{2}$']
    required: [date]
    props:
      date: {type: date}

# For notes whose name starts with a full date, that date must equal the `date`
# property (applies to types with a `date` property; not to yearly meeting series).
name_date_matches_property: true
